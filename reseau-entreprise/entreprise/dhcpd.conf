# Configuration DHCP pour le réseau entreprise

# Subnet entreprise principal
subnet 120.0.28.0 netmask 255.255.254.0 {
  range 120.0.28.100 120.0.28.200;
  option routers 120.0.28.3;  # ent-router
  option domain-name-servers 120.0.54.3;  # Supposé DNS du DMZ
  default-lease-time 600;
  max-lease-time 7200;
}

# Subnet entreprise secondaire
subnet 120.0.30.0 netmask 255.255.255.0 {
  range 120.0.30.100 120.0.30.200;
  option routers 120.0.28.3;  # Via ent-router
  option domain-name-servers 120.0.54.3;
  default-lease-time 600;
  max-lease-time 7200;
}

# Adresses fixes
host ent-server-main {
  hardware ethernet 02:42:78:00:1c:0a;
  fixed-address 120.0.28.10;
}

host ent-server-secondary {
  hardware ethernet 02:42:78:00:1e:0a;
  fixed-address 120.0.30.10;
}

host ent-client {
  hardware ethernet 02:42:78:00:1c:14;
  fixed-address 120.0.28.20;
}