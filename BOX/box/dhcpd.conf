# Fichier de configuration du serveur DHCP (dhcpd.conf)
# Configuration générale
default-lease-time 600;
max-lease-time 7200;
authoritative;

# Configuration du sous-réseau LAN (192.168.20.0/24)
subnet 192.168.20.0 netmask 255.255.255.0 {
  # La plage d'adresses dynamiques (ex: de .50 à .100)
  range 192.168.20.50 192.168.20.100;

  # La passerelle par défaut
  option routers 192.168.20.1;

  # Les serveurs DNS (Google DNS dans cet exemple)
  option domain-name-servers 8.8.8.8;

  # Le masque de sous-réseau
  option subnet-mask 255.255.255.0;
  
  # Adresse de broadcast
  option broadcast-address 192.168.20.255;
}